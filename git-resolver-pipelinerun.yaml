apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: git-resolver-
spec:
  workspaces:
    - name: output  # this workspace name must be declared in the Pipeline
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce  # access mode may affect how you can use this volume in parallel tasks
          resources:
            requests:
              storage: 1Gi
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/aThorp96/tekton-pipeline.git
      - name: revision
        value: dc224a2a8a09b7a168986fe90e868690b0e9ccb1
      - name: pathInRepo
        value: git-resolver-pipeline.yaml
